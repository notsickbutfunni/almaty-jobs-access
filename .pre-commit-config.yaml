# Hooks that run on every `git commit`. Install once with:
#   uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Safety net against accidentally committing raw geodata.
      # --enforce-all checks every tracked file, not just staged additions,
      # so the guard also works in CI on a fresh checkout. 6 MB clears the
      # largest deliberate commit (data/app/tt_car_r8.parquet, ~4.8 MB,
      # D-069) while still catching stray rasters and PBF extracts.
      - id: check-added-large-files
        args: ["--maxkb=6144", "--enforce-all"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
