name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs ruff lint + format AND the hygiene hooks (large-file guard,
      # nbstripout, yaml/toml checks) so they are enforced server-side too,
      # not only on machines where `pre-commit install` was run.
      - name: Lint and hygiene checks (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run tests (offline, sample data only)
        run: uv run pytest

      - name: CLI smoke test
        run: |
          uv run almaty-access --help
          uv run almaty-access info

      - name: Prepare pipeline on the committed sample (offline)
        run: uv run almaty-access prepare -c config/config.sample.yaml -v

      - name: Feature build on the committed sample (offline)
        run: uv run almaty-access features -c config/config.sample.yaml -v
