# Central configuration for the Almaty Jobs & Accessibility Lab.
# Single source of truth: pipeline code reads these values through
# almaty_access.config.load_config() and never hard-codes them.

project:
  study_area: "Almaty, Kazakhstan"
  # Buffer around the city boundary so access near the edge is not cut
  # artificially (edge effect, README §4).
  buffer_km: 5.0

crs:
  # Projected CRS (meters) for ALL distance and area calculations.
  metric: "EPSG:32643" # WGS 84 / UTM zone 43N
  # Geographic CRS (degrees) for storage and web maps only.
  storage: "EPSG:4326"

h3:
  # Main analysis unit (~0.74 km2 per hex).
  analysis_resolution: 8
  # Fine maps and walking analysis (~0.105 km2 per hex).
  fine_resolution: 9

travel:
  # Cumulative-opportunity time thresholds, minutes.
  thresholds_min: [15, 30, 45, 60]
  # Flat-ground speeds, km/h. Slope adjustments arrive in Phase 4
  # (Tobler's hiking function for walk, uphill penalty for bike).
  speeds_kmh:
    walk: 4.8
    bike: 15.0
  # Weekday morning peak used for transit travel times (Phase 4).
  departure_window: ["07:00", "09:00"]

paths:
  # Relative to the repository root (the folder that contains config/).
  raw: data/raw
  interim: data/interim
  processed: data/processed
  sample: data/sample
  figures: reports/figures

# What to download. 'place' is geocoded to the city polygon; 'bbox'
# ([min_lon, min_lat, max_lon, max_lat], EPSG:4326) narrows bbox-capable
# downloads — the sample config uses it, the real pipeline leaves it null.
area:
  place: "Almaty, Kazakhstan"
  bbox: null

# The 8 districts; osm_name must match the OSM 'name' tag of the
# district relation exactly (validated in prepare, which fails loudly
# and lists the names it actually found).
districts:
  - { key: alatau, osm_name: "Алатауский район" }
  - { key: almaly, osm_name: "Алмалинский район" }
  - { key: auezov, osm_name: "Ауэзовский район" }
  - { key: bostandyk, osm_name: "Бостандыкский район" }
  - { key: zhetysu, osm_name: "Жетысуский район" }
  - { key: medeu, osm_name: "Медеуский район" }
  - { key: nauryzbay, osm_name: "Наурызбайский район" }
  - { key: turksib, osm_name: "Турксибский район" }

# Upstream sources, verified 2026-11-03 (provenance and licences:
# data/README.md, DECISIONS.md).
sources:
  geofabrik_pbf_url: "https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf" # ~215 MB, ODbL
  # Kontur Population KZ, release 2023-11-01 (H3 r8, CC BY, ~15 MB gz):
  kontur_gpkg_url: "https://geodata-eu-central-1-kontur-public.s3.amazonaws.com/kontur_datasets/kontur_population_KZ_20231101.gpkg.gz"
  # Informational: the overturemaps package pins the release it reads.
  overture_release: "2026-10-21.0"
  dem_tile_url_template: "https://copernicus-dem-30m.s3.amazonaws.com/{name}/{name}.tif"

# Building merge and floor/GFA estimation (README §7 Phase 1).
buildings:
  iou_threshold: 0.5 # Overture footprint overlapping OSM with IoU >= this is a duplicate
  m_per_level: 3.0 # height (m) -> floors divisor
  default_levels: # fallback floors when no tag and no height, by function
    residential: 2.0
    commercial: 2.0
    industrial: 1.0
    public: 2.0
    unknown: 1.0

pois:
  categories_file: config/poi_categories.yaml

# Phase 2 feature engineering (README §7 Phase 2).
features:
  # Historic centre: Ascension Cathedral in Panfilov Park, the core of
  # old Verny. Distances go from hex centroids to this point.
  center: { lat: 43.2586, lon: 76.9532 }
  # A building whose GFA exceeds this is "large" (README: share of
  # large buildings > 2,000 m2).
  large_gfa_m2: 2000
  # Sampled betweenness centrality on the drive network: number of
  # source nodes (capped at the node count), seeded with random_seed.
  betweenness_k: 500
  # Job sub-centres: DBSCAN over business POIs in the metric CRS.
  # Clusters are ranked by POI count; the one nearest the historic
  # centre is the centre itself and is excluded.
  subcenters:
    eps_m: 400
    min_samples: 40
    max_centers: 5
  # Counts and areas are heavy-tailed; log1p is applied at MODEL time
  # to every feature whose name starts with one of these prefixes.
  # Deliberately narrow: shares (bf_share_*), floor statistics
  # (bf_levels_*) and ratios (pop_per_*) are bounded and must NOT be
  # log-transformed. The feature tables keep raw values;
  # features_report.json records the expanded column list.
  log1p_prefixes:
    - bf_gfa_
    - bf_footprint
    - bf_bldg
    - poi_cnt_
    - poi_density
    - net_len_
    - net_intersection
    - tr_stop
    - pop_residents
    - pop_density
    - ctx_
  # Features that get k-ring neighbourhood context (sums and means over
  # H3 disks, README: job clusters spill over hex borders).
  context_columns:
    [bf_gfa_m2, bf_gfa_commercial_m2, bf_gfa_industrial_m2, poi_cnt_total, pop_residents]
  context_k: [1, 2]
  # Of each feature pair with |r| above this (on the log-transformed r8
  # table) the later column is dropped; the same drop list is applied
  # to r9 so both tables keep identical columns.
  corr_threshold: 0.95

# Used to seed every random number generator in the project.
random_seed: 42
