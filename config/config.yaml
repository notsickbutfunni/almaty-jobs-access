# Central configuration for the Almaty Jobs & Accessibility Lab.
# Single source of truth: pipeline code reads these values through
# almaty_access.config.load_config() and never hard-codes them.

project:
  study_area: "Almaty, Kazakhstan"
  # Buffer around the city boundary so access near the edge is not cut
  # artificially (edge effect, README §4).
  buffer_km: 5.0

crs:
  # Projected CRS (meters) for ALL distance and area calculations.
  metric: "EPSG:32643" # WGS 84 / UTM zone 43N
  # Geographic CRS (degrees) for storage and web maps only.
  storage: "EPSG:4326"

h3:
  # Main analysis unit (~0.74 km2 per hex).
  analysis_resolution: 8
  # Fine maps and walking analysis (~0.105 km2 per hex).
  fine_resolution: 9

travel:
  # Cumulative-opportunity time thresholds, minutes.
  thresholds_min: [15, 30, 45, 60]
  # Flat-ground speeds, km/h. Slope adjustments arrive in Phase 4
  # (Tobler's hiking function for walk, uphill penalty for bike).
  speeds_kmh:
    walk: 4.8
    bike: 15.0
  # Reserved for a timetable-based (GTFS / r5py) transit path. The
  # Phase 4 headway fallback has no departure times - the peak enters
  # only through access.transit.headways_min (see DECISIONS D-047).
  departure_window: ["07:00", "09:00"]

paths:
  # Relative to the repository root (the folder that contains config/).
  raw: data/raw
  interim: data/interim
  processed: data/processed
  sample: data/sample
  figures: reports/figures
  # Dashboard data bundle and static web map (committed; D-069).
  app: data/app
  webmap: docs/webmap

# What to download. 'place' is geocoded to the city polygon; 'bbox'
# ([min_lon, min_lat, max_lon, max_lat], EPSG:4326) narrows bbox-capable
# downloads — the sample config uses it, the real pipeline leaves it null.
area:
  place: "Almaty, Kazakhstan"
  bbox: null

# The 8 districts; osm_name must match the OSM 'name' tag of the
# district relation exactly (validated in prepare, which fails loudly
# and lists the names it actually found).
districts:
  - { key: alatau, osm_name: "Алатауский район" }
  - { key: almaly, osm_name: "Алмалинский район" }
  - { key: auezov, osm_name: "Ауэзовский район" }
  - { key: bostandyk, osm_name: "Бостандыкский район" }
  - { key: zhetysu, osm_name: "Жетысуский район" }
  - { key: medeu, osm_name: "Медеуский район" }
  - { key: nauryzbay, osm_name: "Наурызбайский район" }
  - { key: turksib, osm_name: "Турксибский район" }

# Upstream sources, verified 2026-11-03 (provenance and licences:
# data/README.md, DECISIONS.md).
sources:
  geofabrik_pbf_url: "https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf" # ~215 MB, ODbL
  # Kontur Population KZ, release 2023-11-01 (H3 r8, CC BY, ~15 MB gz):
  kontur_gpkg_url: "https://geodata-eu-central-1-kontur-public.s3.amazonaws.com/kontur_datasets/kontur_population_KZ_20231101.gpkg.gz"
  # Informational: the overturemaps package pins the release it reads.
  overture_release: "2026-10-21.0"
  dem_tile_url_template: "https://copernicus-dem-30m.s3.amazonaws.com/{name}/{name}.tif"

# Building merge and floor/GFA estimation (README §7 Phase 1).
buildings:
  iou_threshold: 0.5 # Overture footprint overlapping OSM with IoU >= this is a duplicate
  m_per_level: 3.0 # height (m) -> floors divisor
  default_levels: # fallback floors when no tag and no height, by function
    residential: 2.0
    commercial: 2.0
    industrial: 1.0
    public: 2.0
    unknown: 1.0

pois:
  categories_file: config/poi_categories.yaml

# Phase 2 feature engineering (README §7 Phase 2).
features:
  # Historic centre: Ascension Cathedral in Panfilov Park, the core of
  # old Verny. Distances go from hex centroids to this point.
  center: { lat: 43.2586, lon: 76.9532 }
  # A building whose GFA exceeds this is "large" (README: share of
  # large buildings > 2,000 m2).
  large_gfa_m2: 2000
  # Sampled betweenness centrality on the drive network: number of
  # source nodes (capped at the node count), seeded with random_seed.
  betweenness_k: 500
  # Job sub-centres: DBSCAN over business POIs in the metric CRS.
  # Clusters are ranked by POI count; the one nearest the historic
  # centre is the centre itself and is excluded.
  subcenters:
    eps_m: 400
    min_samples: 40
    max_centers: 5
  # Counts and areas are heavy-tailed; log1p is applied at MODEL time
  # to every feature whose name starts with one of these prefixes.
  # Deliberately narrow: shares (bf_share_*), floor statistics
  # (bf_levels_*) and ratios (pop_per_*) are bounded and must NOT be
  # log-transformed. The feature tables keep raw values;
  # features_report.json records the expanded column list.
  log1p_prefixes:
    - bf_gfa_
    - bf_footprint
    - bf_bldg
    - poi_cnt_
    - poi_density
    - net_len_
    - net_intersection
    - tr_stop
    - pop_residents
    - pop_density
    - ctx_
  # Features that get k-ring neighbourhood context (sums and means over
  # H3 disks, README: job clusters spill over hex borders).
  context_columns:
    [bf_gfa_m2, bf_gfa_commercial_m2, bf_gfa_industrial_m2, poi_cnt_total, pop_residents]
  context_k: [1, 2]
  # Of each feature pair with |r| above this (on the log-transformed r8
  # table) the later column is dropped; the same drop list is applied
  # to r9 so both tables keep identical columns.
  corr_threshold: 0.95

# Phase 3 job-density model (README §7 Phase 3).
model:
  # Model A: jobs per 100 m2 of GFA by building function. Only the
  # RELATIVE sizes matter — every district is rescaled so its hex sum
  # equals the official district total; the coefficients shape the
  # within-district surface. Rough planning-norm magnitudes, editable.
  baseline_jobs_per_100m2:
    commercial: 3.0
    industrial: 1.0
    public: 2.5
    residential: 0.1
    unknown: 0.5
  # Training target: official per-district payroll jobs (counted at the
  # workplace), annual value = mean of the year's quarters.
  target_indicator: payroll_jobs_located
  # Year the final surfaces are scaled to; falls back to the latest
  # year in district_stats.csv when absent (the synthetic sample has
  # only one year).
  target_year: 2025
  # Districts x years used to train Model B (README: "use multiple
  # years of district data"); intersected with what the CSV holds.
  training_years: [2021, 2022, 2023, 2024, 2025]
  random_forest:
    n_estimators: 500
    min_samples_leaf: 2
    max_features: 0.5 # fraction of features tried per split
  # Reported uncertainty levels (across trees): low / central / high.
  quantiles: [0.1, 0.5, 0.9]

# Phase 4 travel times and accessibility (README §7 Phase 4).
access:
  # Gravity measure: a job's weight halves every this-many minutes of
  # travel (beta = ln 2 / half-life). 20 min is a common urban choice;
  # the report carries a sensitivity check at 10 and 30 min.
  gravity_half_life_min: 20
  # Walk catchment of the two-step floating catchment area (2SFCA) for
  # capacity-constrained services (schools, kindergartens, clinics).
  sfca_catchment_min: 15
  # Green areas below this size are not park destinations (README: >1 ha).
  park_min_m2: 10000
  # A hex centroid farther than this from the mode's network is treated
  # as off-network: excluded from matrices and counted in the report.
  snap_max_m: 2000
  # No public GTFS exists for Almaty (DECISIONS D-016): transit times are
  # APPROXIMATE, built from OSM route relations plus these assumptions.
  # All of them are editable - refine with real operational data.
  transit:
    # Assumed commercial speeds (stop-to-stop, dwell included), km/h.
    speeds_kmh: { bus: 17.0, trolleybus: 15.0, subway: 32.0 }
    # Assumed peak headways, minutes; waiting time = half the headway,
    # paid at every boarding (so a transfer pays a second wait).
    headways_min: { bus: 10.0, trolleybus: 12.0, subway: 7.0 }
    # Straight-line distance between consecutive stops is multiplied by
    # this per-mode factor to approximate the real path: buses wind
    # through the street grid, metro tunnels run nearly straight.
    circuity: { bus: 1.3, trolleybus: 1.3, subway: 1.05 }
  # Free-flow car speeds by OSM highway class (reference mode only;
  # congestion is deliberately not modelled). '_link' classes map to
  # their base class; anything unlisted uses 'default'.
  car_speeds_kmh:
    motorway: 90
    trunk: 70
    primary: 60
    secondary: 50
    tertiary: 45
    unclassified: 40
    residential: 30
    living_street: 15
    service: 20
    default: 30

# Phase 5 equity and spatial statistics (README §7 Phase 5).
equity:
  # A hex with fewer residents is uninhabited: it joins no distribution,
  # LISA run or desert ranking (equity is about people, and an empty
  # mountain cell with zero access is not an injustice).
  min_population: 1
  # Every statistic is produced under two population weightings (the
  # raster, and the raster calibrated to the district shares of
  # employed residents in district_stats.csv - DECISIONS D-058).
  # Benefit measures (more = better) that get the full treatment: Lorenz
  # curve, district table, LISA, deserts, bivariate classes - one list
  # per H3 resolution, each naming columns of THAT access table.
  # 'analysis' (r8) compares the four modes; its FIRST entry drives the
  # one-sentence result. Transit is the approximate lower-bound layer
  # (DECISIONS D-044): every transit statement carries that caveat.
  # 'fine' (r9) holds walking and the service measures, which are
  # granularity noise at r8 (D-049) and independent of the transit layer.
  headline_measures:
    analysis:
      - accpct_jobs_transit_45
      - accpct_jobs_car_45
      - accpct_jobs_bike_45
      - accpct_jobs_walk_30
    fine:
      - accpct_jobs_walk_30
      - sfca_schools_walk
      - sfca_kindergartens_walk
      - sfca_clinics_walk
  # LISA (local Moran): conditional permutations and the significance
  # level applied to the two-sided pseudo p-values.
  lisa_permutations: 9999
  lisa_alpha: 0.05
  # Access desert (README: population above the 75th percentile and
  # accessibility below the 25th). Population: quantile across inhabited
  # hexes ("dense hexes"). Access: at or below the population-WEIGHTED
  # quantile - "the worst-served quarter of residents". The unweighted
  # hex quantile is set by near-empty outskirts and flags almost no
  # hex for the headline job measures; its count is reported beside
  # every result (DECISIONS D-055).
  desert_pop_quantile: 0.75
  desert_access_quantile: 0.25
  # "Share of residents who can reach fewer than X% of city jobs":
  # reported for every cutoff; the headline sentence quotes one of them.
  job_share_cutoffs_pct: [1, 5, 10, 25]
  headline_cutoff_pct: 5
  # "Share of residents within T walking minutes of the nearest ...".
  nearest_thresholds_min: [10, 15, 20, 30]
  # Distance-to-centre bands (upper edges, km; one open band beyond) for
  # the access gradient - the one socio-economic proxy open data supports.
  center_distance_bands_km: [2.5, 5, 7.5, 10, 15]

# Phase 6 scenario analysis (README §7 Phase 6).
scenarios:
  # One scenario per GeoJSON file in this directory; the file stem is the
  # scenario's name. Feature kinds: 'line' (new or extending transit
  # line), 'stop' (explicit station of a named line), 'bike_boost'
  # (bike corridor with a higher flat speed). The committed files are
  # ILLUSTRATIVE alignments anchored to publicly announced projects —
  # redraw them with official designs when those are published.
  dir: config/scenarios
  # An 'extends' line must start (or end) within this distance of the
  # extended route's first or last stop; farther is a drawing error.
  attach_max_m: 1000
  # Default spacing of synthesized stops on a line without drawn stops.
  stop_spacing_m: 600
  # Default half-width of a bike_boost corridor: bike edges mostly
  # inside it ride at the boosted flat speed (grade handling unchanged).
  bike_buffer_m: 30
  # "Residents gaining more than X jobs within the headline threshold"
  # is reported for every cutoff (README Phase 6: population gaining > X).
  gain_cutoffs_jobs: [1000, 10000, 50000]

# Used to seed every random number generator in the project.
random_seed: 42
