# Sample-dataset configuration: a small bbox in central Almaty with all
# data paths under data/sample/. Tests and CI run on the files this
# config produces; raw sample files are committed, interim is generated.
# Everything else mirrors config/config.yaml.

project:
  study_area: "Almaty, Kazakhstan"
  buffer_km: 5.0

crs:
  metric: "EPSG:32643"
  storage: "EPSG:4326"

h3:
  analysis_resolution: 8
  fine_resolution: 9

travel:
  thresholds_min: [15, 30, 45, 60]
  speeds_kmh:
    walk: 4.8
    bike: 15.0
  departure_window: ["07:00", "09:00"]

paths:
  raw: data/sample/raw
  interim: data/sample/interim
  processed: data/sample/processed
  sample: data/sample
  figures: reports/figures
  # Sample export outputs stay under data/sample/ and are git-ignored.
  app: data/sample/app
  webmap: data/sample/webmap

area:
  place: "Almaty, Kazakhstan"
  # ~1.7 x 2.2 km in the dense Almaly core (Panfilov park / Zhibek Zholy).
  bbox: [76.925, 43.235, 76.945, 43.255]

districts:
  - { key: alatau, osm_name: "Алатауский район" }
  - { key: almaly, osm_name: "Алмалинский район" }
  - { key: auezov, osm_name: "Ауэзовский район" }
  - { key: bostandyk, osm_name: "Бостандыкский район" }
  - { key: zhetysu, osm_name: "Жетысуский район" }
  - { key: medeu, osm_name: "Медеуский район" }
  - { key: nauryzbay, osm_name: "Наурызбайский район" }
  - { key: turksib, osm_name: "Турксибский район" }

sources:
  geofabrik_pbf_url: "https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf"
  kontur_gpkg_url: "https://geodata-eu-central-1-kontur-public.s3.amazonaws.com/kontur_datasets/kontur_population_KZ_20231101.gpkg.gz"
  overture_release: "2026-10-21.0"
  dem_tile_url_template: "https://copernicus-dem-30m.s3.amazonaws.com/{name}/{name}.tif"

buildings:
  iou_threshold: 0.5
  m_per_level: 3.0
  default_levels:
    residential: 2.0
    commercial: 2.0
    industrial: 1.0
    public: 2.0
    unknown: 1.0

pois:
  categories_file: config/poi_categories.yaml

# Mirrors config/config.yaml; betweenness_k and the sub-centre search
# are scaled down to the sample's tiny network and POI set.
features:
  center: { lat: 43.2586, lon: 76.9532 }
  large_gfa_m2: 2000
  betweenness_k: 50
  subcenters:
    eps_m: 300
    min_samples: 8
    max_centers: 2
  log1p_prefixes:
    - bf_gfa_
    - bf_footprint
    - bf_bldg
    - poi_cnt_
    - poi_density
    - net_len_
    - net_intersection
    - tr_stop
    - pop_residents
    - pop_density
    - ctx_
  context_columns:
    [bf_gfa_m2, bf_gfa_commercial_m2, bf_gfa_industrial_m2, poi_cnt_total, pop_residents]
  context_k: [1, 2]
  corr_threshold: 0.95

model:
  baseline_jobs_per_100m2:
    commercial: 3.0
    industrial: 1.0
    public: 2.5
    residential: 0.1
    unknown: 0.5
  target_indicator: payroll_jobs_located
  # The synthetic sample stats hold only 2024; the loader resolves this
  # against what exists and warns.
  target_year: 2024
  training_years: [2024]
  random_forest:
    n_estimators: 200
    min_samples_leaf: 2
    max_features: 0.5
  quantiles: [0.1, 0.5, 0.9]

# Mirrors config/config.yaml (see the comments there); the sample bbox
# is small enough that no scaling-down is needed.
access:
  gravity_half_life_min: 20
  sfca_catchment_min: 15
  park_min_m2: 10000
  snap_max_m: 2000
  transit:
    speeds_kmh: { bus: 17.0, trolleybus: 15.0, subway: 32.0 }
    headways_min: { bus: 10.0, trolleybus: 12.0, subway: 7.0 }
    circuity: { bus: 1.3, trolleybus: 1.3, subway: 1.05 }
  car_speeds_kmh:
    motorway: 90
    trunk: 70
    primary: 60
    secondary: 50
    tertiary: 45
    unclassified: 40
    residential: 30
    living_street: 15
    service: 20
    default: 30

# Mirrors config/config.yaml (see the comments there).
equity:
  min_population: 1
  headline_measures:
    analysis:
      - accpct_jobs_transit_45
      - accpct_jobs_car_45
      - accpct_jobs_bike_45
      - accpct_jobs_walk_30
    fine:
      - accpct_jobs_walk_30
      - sfca_schools_walk
      - sfca_kindergartens_walk
      - sfca_clinics_walk
  lisa_permutations: 999
  lisa_alpha: 0.05
  desert_pop_quantile: 0.75
  desert_access_quantile: 0.25
  job_share_cutoffs_pct: [1, 5, 10, 25]
  headline_cutoff_pct: 5
  nearest_thresholds_min: [10, 15, 20, 30]
  center_distance_bands_km: [2.5, 5, 7.5, 10, 15]

# Phase 6 scenario analysis: a small demo scenario inside the sample
# bbox, so the stage runs offline in tests and CI.
scenarios:
  dir: config/scenarios_sample
  attach_max_m: 1000
  stop_spacing_m: 600
  bike_buffer_m: 30
  gain_cutoffs_jobs: [100, 1000, 5000]

random_seed: 42
